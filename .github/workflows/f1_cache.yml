name: F1 Build Cache
on:
  schedule:
    - cron: '0 11 * * 6'
  workflow_dispatch:
jobs:
  build_cache:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Restore FastF1 cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: fastf1-cache-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            fastf1-cache-${{ runner.os }}-

      - name: Create cache directory
        run: mkdir -p cache

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build FastF1 cache
        run: python build_cache.py
