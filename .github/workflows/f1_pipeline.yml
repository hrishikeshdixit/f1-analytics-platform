name: F1 Data Pipeline

on:
  schedule:
    - cron: '0 3 * * 1'   # Monday 3am UTC = Sunday 9pm CST — catches Saturday races
    - cron: '0 3 * * 2'   # Tuesday 3am UTC = Monday 9pm CST — catches Sunday races
  workflow_dispatch:

jobs:
  run_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache FastF1 data
        uses: actions/cache@v4
        with:
          path: cache/
          key: fastf1-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fastf1-cache-${{ runner.os }}-

      - name: Create cache directory
        run: mkdir -p cache

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up GCP credentials
        run: |
          mkdir -p secrets
          echo '${{ secrets.GCP_KEY_JSON }}' > secrets/gcp_key.json

      - name: Set up environment variables
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=./secrets/gcp_key.json" >> .env
          echo "BQ_PROJECT_ID=${{ secrets.BQ_PROJECT_ID }}" >> .env
          echo "BQ_DATASET_RAW=raw" >> .env
          echo "BQ_DATASET_TRANSFORMED=transformed" >> .env

      - name: Set up dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          f1:
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: ${{ secrets.BQ_PROJECT_ID }}
                dataset: transformed
                threads: 4
                timeout_seconds: 300
                location: US
                keyfile: ${{ github.workspace }}/secrets/gcp_key.json
            target: dev
          EOF

      - name: Run F1 data ingestion
        run: python ingestion/extract_and_load.py

      - name: Run dbt models
        working-directory: dbt/f1
        run: |
          dbt deps
          dbt run
          dbt test
          exit 1

      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ F1 Pipeline Failed — ${{ github.run_id }}"
          body: |
            F1 Analytics Pipeline failed!

            Run ID: ${{ github.run_id }}
            Triggered by: ${{ github.event_name }}

            View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: thehrishikeshdixit@gmail.com
          from: F1 Analytics Pipeline

      - name: Send success notification
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ F1 Pipeline Succeeded — ${{ github.run_id }}"
          body: |
            F1 Analytics Pipeline completed successfully!

            Run ID: ${{ github.run_id }}
            Triggered by: ${{ github.event_name }}

            View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: thehrishikeshdixit@gmail.com
          from: F1 Analytics Pipeline
