name: F1 Data Pipeline
on:
  schedule:
    - cron: '0 3 * * 2'  # Tuesday 3am UTC
  workflow_dispatch:

jobs:
  run_dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install dbt-bigquery
      - name: Set up GCP credentials
        run: |
          mkdir -p secrets
          echo '${{ secrets.GCP_KEY_JSON }}' > secrets/gcp_key.json
      - name: Set up dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          f1:
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: ${{ secrets.BQ_PROJECT_ID }}
                dataset: transformed
                threads: 4
                timeout_seconds: 300
                location: US
                keyfile: ${{ github.workspace }}/secrets/gcp_key.json
            target: dev
          EOF
      - name: Run dbt
        working-directory: dbt/f1
        run: |
          dbt deps
          dbt run
          dbt test
      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ F1 dbt Failed — ${{ github.run_id }}"
          body: |
            dbt run/test failed!
            View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: thehrishikeshdixit@gmail.com
          from: F1 Analytics Pipeline
      - name: Send success notification
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ F1 dbt Succeeded — ${{ github.run_id }}"
          body: |
            dbt completed successfully!
            View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: thehrishikeshdixit@gmail.com
          from: F1 Analytics Pipeline
